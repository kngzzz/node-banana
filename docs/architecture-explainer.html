<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>node-banana architecture</title>
<meta name="description" content="An isometric, scrubbable explainer of Node Banana: a local, bring-your-own-key node editor whose browser runs the graph, whose Next.js routes call the AI providers, and whose asset library keeps every output on disk.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --bg: #F4F4F2;
  --paper: #FFFFFF;
  --ink: #161616;
  --ink-2: #4A4A4A;
  --grey: #8A8A8A;
  --hair: #D3D3CE;
  --red: #FF2E2E;
  --blue: #1F5BFF;
  --magenta: #FF2BD6;
  --yellow: #FFD400;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --bar-h: 64px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
body { font-family: var(--sans); -webkit-font-smoothing: antialiased; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#overlay { position: fixed; inset: 0; pointer-events: none; }
#leaders { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
#leaders line { stroke: var(--grey); stroke-width: 1; vector-effect: non-scaling-stroke; }
#leaders line.tree { stroke-dasharray: 3 3; }
#leaders circle { fill: var(--ink); }
#leaders circle.focus { fill: var(--yellow); stroke: var(--ink); stroke-width: 1; }

/* debug corners */
.corner { position: absolute; font: 400 10px/1.45 var(--mono); color: var(--grey); letter-spacing: 0.02em; white-space: nowrap; }
.corner b { color: var(--ink); font-weight: 600; }
#c-tl { top: 14px; left: 18px; }
#c-tr { top: 14px; right: 18px; text-align: right; }
#c-bl { bottom: calc(var(--bar-h) + 12px); left: 18px; }
#c-br { bottom: calc(var(--bar-h) + 12px); right: 18px; text-align: right; }
#legend { margin-top: 8px; display: inline-grid; grid-template-columns: auto auto; column-gap: 8px; row-gap: 1px; text-align: left; }
#legend i { display: inline-block; width: 8px; height: 8px; margin-right: 5px; vertical-align: -1px; }
#legend span { color: var(--ink-2); }

/* title band */
#band { position: absolute; top: 36px; left: 18px; max-width: min(72vw, 1100px); }
#title { font: 500 clamp(24px, 3.1vw, 42px)/1.08 var(--sans); letter-spacing: -0.022em; white-space: nowrap; margin: 0; }
#idea { margin-top: 8px; font: 400 clamp(13px, 1.12vw, 16px)/1.35 var(--sans); color: var(--ink-2); white-space: nowrap; }
#step { margin-top: 8px; font: 500 11px/1.4 var(--mono); color: var(--ink); white-space: nowrap; min-height: 15px; }
#step .n { display: inline-block; background: var(--yellow); color: var(--ink); padding: 0 5px; margin-right: 8px; }
.inf { display: inline-block; font: 600 9px/1 var(--mono); letter-spacing: 0.06em; color: var(--ink-2); border: 1px solid var(--ink-2); padding: 2px 4px 1px; margin-left: 8px; vertical-align: 2px; }

/* labels */
.lbl { position: absolute; left: 0; top: 0; max-width: 400px; background: var(--paper); border: 1px solid var(--hair); padding: 6px 8px 7px; font: 400 10px/1.4 var(--mono); color: var(--ink-2); white-space: nowrap; will-change: transform, opacity; opacity: 0; }
.lbl .nm { font-weight: 600; font-size: 11px; color: var(--ink); }
.lbl .nm .k { display: inline-block; width: 7px; height: 7px; margin-right: 6px; vertical-align: 0; background: var(--ink); }
.lbl .pt { color: var(--grey); }
.lbl .ow { color: var(--ink-2); font-family: var(--sans); font-size: 11px; margin-top: 2px; }
.lbl .sy { color: var(--ink); margin-top: 3px; }
.lbl .sy::before { content: "fn "; color: var(--grey); }
.lbl .sy.type::before { content: "type "; }
.lbl .sy.val::before { content: "const "; }
.lbl pre { margin: 5px 0 0; padding: 4px 6px; background: var(--bg); font: 400 9.5px/1.45 var(--mono); color: var(--ink-2); border-left: 2px solid var(--hair); }
.lbl pre .ln { color: var(--grey); margin-right: 8px; }
.lbl .detail { display: block; }
.lbl.brief .detail { display: none; }
.lbl.brief { padding: 3px 6px 4px; }
.lbl.brief .nm { font-size: 10px; }
.lbl .bp { display: none; color: var(--grey); margin-left: 6px; }
.lbl.brief .bp { display: inline; }
.coord { position: absolute; left: 0; top: 0; font: 400 9px/1 var(--mono); color: var(--grey); white-space: nowrap; opacity: 0; }

/* tags */
.tag { position: absolute; left: 0; top: 0; font: 600 10px/1 var(--mono); letter-spacing: 0.04em; padding: 4px 6px 3px; white-space: nowrap; background: var(--paper); border: 1px solid var(--ink); color: var(--ink); opacity: 0; }
.tag.red { color: var(--red); border-color: var(--red); }
.tag.blue { color: var(--blue); border-color: var(--blue); }
.tag.magenta { color: var(--magenta); border-color: var(--magenta); }
.tag.yellow { background: var(--yellow); border-color: var(--ink); }

/* file tree */
#tree { position: absolute; left: 18px; width: min(460px, 44vw); opacity: 0; font: 400 11px/1.25 var(--mono); }
#tree .hd { color: var(--grey); font-size: 10px; margin-bottom: 6px; }
#tree .row { display: flex; gap: 10px; padding: 3px 0 3px 10px; color: var(--grey); border-left: 2px solid transparent; }
#tree .row .p { color: var(--ink-2); min-width: 9.5em; font-weight: 600; }
#tree .row .n { font-family: var(--sans); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#tree .row.on { border-left-color: var(--yellow); background: rgba(255, 212, 0, 0.14); color: var(--ink); }
#tree .row.on .p { color: var(--ink); }

/* control bar */
#bar { position: fixed; left: 0; right: 0; bottom: 0; height: var(--bar-h); background: var(--paper); border-top: 1px solid var(--hair); display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; column-gap: 14px; padding: 0 18px; font: 400 10px/1 var(--mono); color: var(--grey); user-select: none; }
#bar button { font: inherit; color: var(--ink); background: none; border: 0; cursor: pointer; padding: 0; }
#bar button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
#play { width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid var(--ink) !important; }
#play svg { width: 12px; height: 12px; fill: var(--ink); }
#tc { min-width: 104px; color: var(--ink); }
#tl { position: relative; height: 40px; }
#chaps { position: absolute; left: 0; right: 0; top: 2px; height: 20px; display: flex; }
#chaps button { position: relative; flex: none; height: 20px; text-align: left; padding: 0 6px !important; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--grey) !important; border-left: 1px solid var(--hair) !important; font-size: 10px; }
#chaps button.on { color: var(--ink) !important; }
#chaps button.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--yellow); }
#chaps button .cn { color: var(--ink-2); margin-right: 5px; }
#track { position: absolute; left: 0; right: 0; top: 27px; height: 8px; background: var(--bg); cursor: pointer; touch-action: none; }
#fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--ink); }
#knob { position: absolute; top: -4px; width: 2px; height: 16px; background: var(--ink); transform: translateX(-1px); }
#speed { display: flex; border: 1px solid var(--hair); }
#speed button { padding: 6px 8px !important; color: var(--grey) !important; }
#speed button.on { color: var(--ink) !important; background: var(--bg) !important; }
.fatal { position: fixed; inset: 0; display: grid; place-items: center; font: 500 14px var(--mono); color: var(--red); }

@media (max-width: 760px) {
  :root { --bar-h: 64px; }
  #band { top: 32px; max-width: calc(100vw - 36px); }
  #title { font-size: 22px; white-space: normal; }
  #idea { white-space: normal; font-size: 13px; }
  #step { white-space: normal; font-size: 10px; line-height: 1.5; }
  #c-tr .fps-extra, #legend span { display: none; }
  #legend { position: fixed; left: 12px; bottom: calc(var(--bar-h) + 40px); margin: 0; grid-template-columns: auto auto auto auto; column-gap: 10px; }
  #c-bl { left: 12px; bottom: calc(var(--bar-h) + 8px); }
  #c-bl .iso { display: none; }
  #c-br { right: 12px; bottom: calc(var(--bar-h) + 24px); }
  #c-br .br { display: none; }
  #chaps button { padding: 0 3px !important; font-size: 9px; }
  #chaps button .cl { display: none; }
  #chaps button .cn { margin: 0; }
  #bar { grid-template-columns: auto 1fr auto; column-gap: 10px; padding: 0 12px; }
  #tc { display: none; }
  #speed button { padding: 6px 5px !important; }
  .lbl { max-width: 240px; }
  .lbl .ow { white-space: normal; }
  .lbl.brief .bp { display: none; }
  .lbl pre, .lbl .sy { display: none; }
  #tree { width: calc(100vw - 36px); }
  #tree .row { display: block; padding: 2px 0 2px 8px; }
  #tree .row .p { display: block; min-width: 0; }
  #tree .row .n { display: block; white-space: normal; font-size: 10.5px; color: inherit; }
  .coord { display: none; }
}

</style>
</head>

    var ta = ci === CH.length - 1 ? fadeIn : Math.min(fadeIn, fadeOut);
    titleEl.style.opacity = ta; titleEl.style.transform = 'translateY(' + ((1 - fadeIn) * 10).toFixed(1) + 'px)';
    ideaEl.style.opacity = ta; stepEl.style.opacity = ta;
    // tree panel
    var tr = -1;
    if (c.tree) for (var k = 0; k < TREEV.length; k++) { if (TREEV[k].ch === ci && TREEV[k].t <= t + 1e-6) tr = TREEV[k].i; }
    var treeA = c.tree ? ta : 0;
    treeEl._a = treeA;
    treeEl.style.opacity = treeA;
    treeEl.style.top = (BAND.b + 18) + 'px';
    if (hudCache.tree !== tr) { hudCache.tree = tr; TREE_ROWS.forEach(function (r, i) { r.classList.toggle('on', i === tr); }); }
    if (treeA > 0.05 && tr >= 0 && S.tree[tr].ids && S.tree[tr].ids.length && MODS[S.tree[tr].ids[0]]) {
      var rr = TREE_ROWS[tr].getBoundingClientRect();
      var Mx = MODS[S.tree[tr].ids[0]];
      toScreen(Mx.anchor, _sp);
      treeLine.setAttribute('x1', (rr.right + 6).toFixed(1)); treeLine.setAttribute('y1', (rr.top + rr.height / 2).toFixed(1));
      treeLine.setAttribute('x2', _sp.x.toFixed(1)); treeLine.setAttribute('y2', _sp.y.toFixed(1));
      treeDot.setAttribute('cx', _sp.x.toFixed(1)); treeDot.setAttribute('cy', _sp.y.toFixed(1));
      treeLine.style.opacity = treeA; treeDot.style.opacity = treeA;
    } else { treeLine.style.opacity = 0; treeDot.style.opacity = 0; }
    // corners
    setHTML($('c-tl'), 'tl', '<b>CH ' + String(ci + 1).padStart(2, '0') + '/' + String(CH.length).padStart(2, '0') + '</b> &nbsp;' + esc(c.short.toUpperCase()) + ' &nbsp;' + fmt(t) + ' / ' + fmt(DURATION));
    fpsAcc += dt; fpsN++;
    if (now - fpsT > 500) { fpsShown = fpsN / Math.max(1e-3, fpsAcc); fpsAcc = 0; fpsN = 0; fpsT = now; }
    setHTML($('fps'), 'fps', '<b>' + Math.round(fpsShown) + ' FPS</b><span class="fps-extra"> &nbsp;' + frameMs.toFixed(2) + ' ms js &nbsp;' + renderer.info.render.calls + ' draws</span>');
    setHTML($('c-bl'), 'bl', 'CAM <b>x:' + cam.x.toFixed(2) + ' y:' + cam.y.toFixed(2) + ' z:' + cam.z.toFixed(2) + '</b> &nbsp;ZOOM <b>' + cam.zoom.toFixed(2) + '</b> <span class="iso"> &nbsp;ORTHO ISO 45° / 35.264°</span>');
    tcEl.textContent = fmt(t) + ' / ' + fmt(DURATION);
    var pr = t / DURATION;
    fillEl.style.width = (pr * 100).toFixed(2) + '%';
    knob.style.left = (pr * 100).toFixed(2) + '%';
    track.setAttribute('aria-valuenow', Math.round(pr * 100));
    CH.forEach(function (x, i) { x.btn.classList.toggle('on', i === ci); });
  }

  // ---------- loop ----------
  var lastNow = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.1, Math.max(0, (now - lastNow) / 1000));
    lastNow = now;
    var t0 = performance.now();
    if (master.isActive()) U.time.value += dt * master.timeScale();
    updateCamera();
    applyModules();
    applyPipes();
    layoutTags();
    layoutLabels(dt);
    hud(now, dt);
    if (snapFrames > 0) snapFrames--;
    frameMs = frameMs * 0.9 + (performance.now() - t0) * 0.1;
    renderer.render(scene, camera);
  }

  // ---------- test hooks ----------
  function report() {
    var out = { t: master.time(), labels: [], tags: [], overlaps: [], offscreen: [], anchorsUnderBand: [], titleOverflow: false, ideaOverflow: false, stepOverflow: false };
    var band = rectOf(bandEl);
    var tl = rectOf(titleEl);
    out.titleOverflow = titleEl.scrollWidth > Math.ceil(titleEl.clientWidth) + 1 || tl.r > VW - 12;
    out.ideaOverflow = rectOf(ideaEl).r > VW - 12 || ideaEl.scrollWidth > Math.ceil(ideaEl.clientWidth) + 1;
    out.stepOverflow = rectOf(stepEl).r > VW - 12;
    var trr = rectOf($('c-tr'));
    out.titleHitsLegend = Math.min(VW, tl.l + titleEl.scrollWidth) > trr.l - 8 && tl.t < trr.b;
    var titleRect = { l: tl.l, t: tl.t, r: Math.min(VW, tl.l + titleEl.scrollWidth), b: rectOf(stepEl).b };
    var obst = [{ n: 'title', r: titleRect }, { n: 'c-tl', r: OBST[0] }, { n: 'c-tr', r: OBST[1] }, { n: 'c-bl', r: OBST[2] }, { n: 'c-br', r: OBST[3] }, { n: 'bar', r: rectOf($('bar')) }];
    if (treeEl._a > 0.05) obst.push({ n: 'tree', r: rectOf(treeEl) });
    var items = VIS.filter(function (V) { return V.M.L.a > 0.5 && V.rect; }).map(function (V) { return { n: 'label:' + V.M.id, r: V.rect, a: [V.ax, V.ay] }; });
    TAGS.forEach(function (tg) { if (tg.on && tg.s.a > 0.5 && tg.rect) items.push({ n: 'tag:' + tg.el.textContent, r: tg.rect }); });
    out.labels = items.map(function (x) { return x.n; });
    function ov(a, b) { return Math.max(0, Math.min(a.r, b.r) - Math.max(a.l, b.l)) * Math.max(0, Math.min(a.b, b.b) - Math.max(a.t, b.t)); }
    for (var i = 0; i < items.length; i++) {
      for (var j = i + 1; j < items.length; j++) { var o = ov(items[i].r, items[j].r); if (o > 4) out.overlaps.push([items[i].n, items[j].n, Math.round(o)]); }
      obst.forEach(function (O) { var o2 = ov(items[i].r, O.r); if (o2 > 4) out.overlaps.push([items[i].n, O.n, Math.round(o2)]); });
      var r = items[i].r;
      if (r.l < 0 || r.t < 0 || r.r > VW || r.b > VH) out.offscreen.push(items[i].n);
      if (items[i].a && items[i].a[1] < band.b) out.anchorsUnderBand.push(items[i].n);
    }
    // focused modules that fall off screen
    out.modulesOffscreen = [];
    MOD_LIST.forEach(function (M) {
      if (M.s.e < 0.5 || M.s.dim < 0.9 || M.s.lift > 0.5) return;
      var pts = [[M.x - M.w / 2, M.y, M.z - M.d / 2], [M.x + M.w / 2, M.y, M.z + M.d / 2], [M.x + M.w / 2, M.y + M.top, M.z - M.d / 2], [M.x - M.w / 2, M.y + M.top, M.z + M.d / 2]];
      var bad = pts.some(function (p) { var q = toScreen(new T.Vector3(p[0], p[1], p[2]), {}); return q.x < 0 || q.x > VW || q.y < band.b - 40 || q.y > VH - 64; });
      if (bad) out.modulesOffscreen.push(M.id);
    });
    out.jsFrameMs = frameMs;
    out.draws = renderer.info.render.calls;
    return out;
  }
  window.__explainer = {
    ready: true, duration: DURATION, chapters: CH.map(function (c) { return { id: c.id, title: c.title, t0: c.t0, t1: c.t1 }; }),
    seek: function (t) { master.pause(); seek(t); syncPlayBtn(); }, play: function () { setPlaying(true); }, pause: function () { setPlaying(false); },
    report: report, master: master
  };

  resize();
  updateCamera();
  requestAnimationFrame(frame);
  var startAt = parseFloat(Q.get('t') || '0') || 0;
  if (startAt) seek(startAt);
  if (Q.get('paused') !== '1') setTimeout(function () { setPlaying(true); }, 350);
  else syncPlayBtn();
})();

</script>
